name: Prepare public toolkit release
on:
  push:
    branches: [release/v0.1.0]
    paths: [release-source.b64, prepare_release.py]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'WBZKLLC/workflow-inspector-toolkit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out public release input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source, render previews, and prepare Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 prepare_release.py
